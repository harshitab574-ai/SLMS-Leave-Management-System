<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            margin:0;
            background:#f5f6fa;
        }

        .sidebar{
            width:250px;
            height:100vh;
            background:#0d6efd;
            position:fixed;
            left:0;
            top:0;
            color:white;
        }

        .sidebar h3{
            text-align:center;
            padding:20px;
            border-bottom:1px solid rgba(255,255,255,.3);
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            padding:15px 20px;
        }

        .sidebar a:hover{
            background:#084298;
        }

        .content{
            margin-left:250px;
            padding:20px;
        }

        .card{
            border:none;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }
    </style>

</head>

<body>

<div class="sidebar">

    <h3>SLMS</h3>

    <a href="{% url 'home' %}">Dashboard</a>

    <a href="{% url 'add_staff' %}">
        Add Staff
    </a>

    <a href="{% url 'view_staff' %}">
        View Staff
    </a>

    

    <a href="{% url 'leave_request' %}">
        Leave Requests
    </a>
    
    <a href="{% url 'logout' %}" class="btn btn-danger">
    Logout
</a>

</div>

<div class="content">

{% block content %}

{% endblock %}

</div>

</body>
</html>
