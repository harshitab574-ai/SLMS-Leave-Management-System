{% extends 'admin/base.html' %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">Dashboard</h2>

    <div class="row">

        <div class="col-md-3">
            <div class="card bg-primary text-white shadow">
                <div class="card-body text-center">
                    <h5>Total Staff</h5>
                    <h2>{{ total_staff }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-success text-white shadow">
                <div class="card-body text-center">
                    <h5>Total Leaves</h5>
                    <h2>{{ total_leave }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-warning text-dark shadow">
                <div class="card-body text-center">
                    <h5>Pending</h5>
                    <h2>{{ pending_leave }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-danger text-white shadow">
                <div class="card-body text-center">
                    <h5>Approved</h5>
                    <h2>{{ approved_leave }}</h2>
                </div>
            </div>
        </div>

    </div>

</div>

{% endblock %}
