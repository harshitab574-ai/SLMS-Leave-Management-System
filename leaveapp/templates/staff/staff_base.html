<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            margin:0;
            background:#f5f6fa;
        }

        .sidebar{
            width:250px;
            height:100vh;
            position:fixed;
            background:#0d6efd;
            color:white;
        }

        .sidebar h3{
            text-align:center;
            padding:20px;
            border-bottom:1px solid rgba(255,255,255,.2);
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            padding:15px 20px;
            transition:.3s;
        }

        .sidebar a:hover{
            background:white;
            color:#0d6efd;
        }

        .content{
            margin-left:250px;
        }

        .navbar{
            background:white;
            box-shadow:0 2px 10px rgba(0,0,0,.1);
        }

    </style>

</head>

<body>

<div class="sidebar">

    <h3>Staff Panel</h3>

    <a href="{% url 'staff_dashboard' %}">🏠 Dashboard</a>

    <a href="{% url 'staff_profile' request.user.id %}">👤 My Profile</a>

    <a href="{% url 'staff_apply_leave' %}">📝 Apply Leave</a>

    <a href="{% url 'staff_leave_history' %}">📋 Leave History</a>

    <a href="{% url 'logout' %}">🚪 Logout</a>

</div>

<div class="content">

    <nav class="navbar navbar-expand-lg px-4">

        <h4 class="mb-0">Staff Leave Management System</h4>

    </nav>

    <div class="container mt-4">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
