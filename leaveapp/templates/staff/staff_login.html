<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f5f5;
        }
        .login-box{
            width:400px;
            margin:80px auto;
            padding:30px;
            background:white;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }
    </style>
</head>
<body>

<div class="login-box">

    <h2 class="text-center mb-4">Staff Login</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Email</label>
            <input type="email"
                   name="username"
                   class="form-control"
                   placeholder="Enter Email"
                   required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter Password"
                   required>
        </div>

        <button type="submit" class="btn btn-success w-100">
            Login
        </button>

    </form>

    <div class="text-center mt-3">
        <a href="{% url 'index' %}">← Back to Home</a>
    </div>

</div>

</body>
</html>
