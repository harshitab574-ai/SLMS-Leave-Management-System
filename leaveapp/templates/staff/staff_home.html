{% extends 'staff/staff_base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Welcome Staff</h3>
        </div>

        <div class="card-body">

            <h4>Hello, {{ request.user.username }}</h4>

            <p>Welcome to the Staff Leave Management System.</p>

            <div class="row mt-4">

                <div class="col-md-4">
                    <div class="card bg-info text-white">
                        <div class="card-body text-center">
                            <h5>Profile</h5>
                            <a href="{% url 'staff_profile' %}" class="btn btn-light mt-2">
                                View
                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card bg-success text-white">
                        <div class="card-body text-center">
                            <h5>Apply Leave</h5>
                            <a href="{% url 'staff_apply_leave' %}" class="btn btn-light mt-2">
                                Apply
                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card bg-warning text-dark">
                        <div class="card-body text-center">
                            <h5>My Leave</h5>
                            <a href="{% url 'my_leave' %}" class="btn btn-dark mt-2">
                                View
                            </a>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
